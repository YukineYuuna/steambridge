name: Package macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            flag: --arm64
          - arch: x64
            flag: --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: Build DMG and ZIP
        run: npm run build:mac -- ${{ matrix.flag }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify unsigned artifacts and installation layout
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name '*.app' -not -path '*/Contents/Frameworks/*' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          test -x "$APP_PATH/Contents/MacOS/$EXECUTABLE"
          file "$APP_PATH/Contents/MacOS/$EXECUTABLE"
          lipo -info "$APP_PATH/Contents/MacOS/$EXECUTABLE" | tee "$RUNNER_TEMP/lipo.txt"
          grep -Eq '${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}' "$RUNNER_TEMP/lipo.txt"
          DMG_PATH="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          ZIP_PATH="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$DMG_PATH"; test -n "$ZIP_PATH"
          MOUNT_POINT="$RUNNER_TEMP/steambridge-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          test -d "$MOUNT_POINT/SteamBridge.app"
          ditto "$MOUNT_POINT/SteamBridge.app" "$RUNNER_TEMP/SteamBridge-from-dmg.app"
          hdiutil detach "$MOUNT_POINT"
          mkdir -p "$RUNNER_TEMP/steambridge-zip"
          ditto -x -k "$ZIP_PATH" "$RUNNER_TEMP/steambridge-zip"
          test -d "$RUNNER_TEMP/steambridge-zip/SteamBridge.app"
      - uses: actions/upload-artifact@v4
        with:
          name: SteamBridge-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
